services:
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:5173/ && curl -fsS -o /dev/null http://localhost:5173/src/main.jsx || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  node_modules:
