services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -m 5 http://localhost:5173/ | grep -q 'id=\"root\"' || (echo 'vite dev server not serving index' && exit 1)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 120s

volumes:
  node_modules:
